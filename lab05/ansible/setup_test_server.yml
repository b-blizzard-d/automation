- hosts: test
  become: yes

  tasks:
    - name: ставим apache и php
      apt:
        name:
          - apache2
          - php
          - libapache2-mod-php
        update_cache: yes

    # apt в контейнере сам apache не запускает
    - name: запускаем apache
      service:
        name: apache2
        state: started

    # своя настройка php для apache
    - name: часовой пояс для php
      copy:
        dest: /etc/php/8.3/apache2/conf.d/99-tip-splitter.ini
        content: |
          date.timezone = Europe/Chisinau
      notify: restart apache

    - name: сайт для tip-splitter
      copy:
        dest: /etc/apache2/sites-available/tip-splitter.conf
        content: |
          <VirtualHost *:80>
              DocumentRoot /var/www/tip-splitter/public
              <Directory /var/www/tip-splitter/public>
                  Require all granted
              </Directory>
          </VirtualHost>
      notify: restart apache

    - name: включаем сайт
      command: a2ensite tip-splitter
      notify: restart apache

    - name: выключаем стандартный сайт
      command: a2dissite 000-default
      notify: restart apache

  handlers:
    - name: restart apache
      service:
        name: apache2
        state: restarted
